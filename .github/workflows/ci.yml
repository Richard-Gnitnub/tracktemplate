name: Standalone CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Parse tracked Python and macro sources
        run: python tools/validate_python_syntax.py

      - name: Run standalone tests and repository contracts
        id: standalone
        run: python tools/run_standalone_validators.py --profile ci

      - name: Preserve standalone validation output
        if: ${{ always() && steps.standalone.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: benchmark-output/standalone-validation/
          if-no-files-found: error
