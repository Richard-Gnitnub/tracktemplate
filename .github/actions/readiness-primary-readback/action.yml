name: Read back the primary readiness artifact
description: Wait briefly for visibility, then download the exact uploaded artifact.
inputs:
  artifact-id:
    description: ID of the primary artifact from this job.
    required: true
runs:
  using: composite
  steps:
    - name: Allow the uploaded ID to become visible
      shell: bash
      env:
        PRIMARY_ARTIFACT_ID: ${{ inputs.artifact-id }}
      run: |
        [[ "$PRIMARY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
        sleep 2

    - name: Download the exact primary artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        merge-multiple: true
        path: ${{ runner.temp }}/compatibility-readiness-primary-readback
